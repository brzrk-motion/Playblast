services:
  playblast:
    image: playblast:latest
    build: .
    init: true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      DB_PATH: /app/data/playblast.db
      # Set these in an external .env file before starting the pilot.
      PLAYBLAST_AUTH_USER: ${PLAYBLAST_AUTH_USER:?Set PLAYBLAST_AUTH_USER}
      PLAYBLAST_AUTH_PASSWORD: ${PLAYBLAST_AUTH_PASSWORD:?Set PLAYBLAST_AUTH_PASSWORD}
    volumes:
      - playblast_uploads:/app/uploads
      - playblast_data:/app/data
    restart: unless-stopped

volumes:
  playblast_uploads:
  playblast_data:

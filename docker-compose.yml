services:
  playblast:
    build: .
    ports:
      - "3000:3000"
    environment:
      UPLOAD_DIR: /app/uploads
      DB_PATH: /app/data/playblast.db
    volumes:
      - playblast_uploads:/app/uploads
      - playblast_data:/app/data
    restart: unless-stopped

volumes:
  playblast_uploads:
  playblast_data:
